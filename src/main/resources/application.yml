spring:
  application:
    name: agentops
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agentops}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:agentops}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  refresh-token:
    expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
