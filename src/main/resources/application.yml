spring:
  application:
    name: agentops
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agentops}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:agentops}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  refresh-token:
    expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}

agent:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:30}
    max-tool-rounds: ${AGENT_MAX_TOOL_ROUNDS:4}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:8}
    context-messages: ${AGENT_CONTEXT_MESSAGES:40}
    max-output-tokens: ${DEEPSEEK_MAX_OUTPUT_TOKENS:2048}
