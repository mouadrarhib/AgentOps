<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">JWT authentication and persisted sessions</title>
  <desc id="desc">Login creates a database session, a signed access JWT, and an opaque refresh token. Protected requests validate the token, session, and permissions. Refresh rotates the stored hash and logout revokes the session.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#62dce9"/></marker></defs>
  <rect width="1200" height="480" rx="22" fill="#08162f"/>
  <text x="48" y="58" fill="#f3f7ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Authentication with revocable sessions</text>
  <text x="48" y="88" fill="#9eb4d7" font-family="Arial,sans-serif" font-size="16">JWT proves identity; a database session keeps the token accountable.</text>
  <g font-family="Arial,sans-serif">
    <rect x="48" y="142" width="247" height="98" rx="17" fill="#1b3655" stroke="#5fcbdf"/><text x="68" y="174" fill="#72e6ec" font-size="15" font-weight="700">01 · LOGIN</text><text x="68" y="206" fill="#edf8ff" font-size="18">Verify password</text>
    <rect x="340" y="142" width="247" height="98" rx="17" fill="#23345a" stroke="#899ef1"/><text x="360" y="174" fill="#b3bbff" font-size="15" font-weight="700">02 · ISSUE</text><text x="360" y="206" fill="#f0f2ff" font-size="18">JWT + refresh token</text>
    <rect x="632" y="142" width="247" height="98" rx="17" fill="#23345a" stroke="#899ef1"/><text x="652" y="174" fill="#b3bbff" font-size="15" font-weight="700">03 · STORE</text><text x="652" y="206" fill="#f0f2ff" font-size="18">Session + refresh hash</text>
    <rect x="924" y="142" width="228" height="98" rx="17" fill="#1b3655" stroke="#5fcbdf"/><text x="944" y="174" fill="#72e6ec" font-size="15" font-weight="700">04 · REQUEST</text><text x="944" y="206" fill="#edf8ff" font-size="18">Bearer or cookie</text>
    <rect x="48" y="315" width="330" height="100" rx="17" fill="#263056" stroke="#a493e3"/><text x="68" y="346" fill="#c7baff" font-size="15" font-weight="700">PROTECTED API</text><text x="68" y="376" fill="#f2eeff" font-size="17">Check JWT, session, role, owner</text>
    <rect x="435" y="315" width="330" height="100" rx="17" fill="#1d4050" stroke="#66d9d0"/><text x="455" y="346" fill="#8bf0db" font-size="15" font-weight="700">REFRESH</text><text x="455" y="376" fill="#e9fcf7" font-size="17">Rotate hash; keep session expiry</text>
    <rect x="822" y="315" width="330" height="100" rx="17" fill="#3b2d50" stroke="#c38ee2"/><text x="842" y="346" fill="#e0b5ff" font-size="15" font-weight="700">LOGOUT / PASSWORD CHANGE</text><text x="842" y="376" fill="#f9edff" font-size="17">Revoke current / all sessions</text>
  </g>
  <g fill="none" stroke="#62dce9" stroke-width="2.5" marker-end="url(#a)"><path d="M295 191H332"/><path d="M587 191H624"/><path d="M879 191H916"/><path d="M1038 240V271H213V307"/><path d="M1038 271H600V307"/><path d="M1038 271V307"/></g>
</svg>
